
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Verification</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script type="module" src="https://pyscript.net/releases/2024.11.1/core.js"></script>
</head>

<body class="container mt-5">

    <h1>ICT Club Candidate Verification</h1>
    <p>Enter your name to check if you are part of the ICT Club.</p>

    <label>First Name</label>
    <input type="text" id="first_name" class="form-control mb-3">

    <label>Last Name</label>
    <input type="text" id="last_name" class="form-control mb-3">

    <button class="btn btn-primary" py-click="verify_candidate">Verify</button>

    <p id="result" class="mt-3"></p>

    <py-script src="main.py"></py-script>

</body>
</html>
